version: "3.9"

services:
  frontend:
    build: .
    container_name: dealer_nextjs_frontend
    restart: always
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_HOST_DEV=http://localhost:8001
